name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: cargo build --release

      - name: Package
        run: |
          strip target/release/tunna
          mkdir dist
          cp target/release/tunna tunna.service tunnel-cloudflared.service dist/
          sha256sum dist/tunna > dist/tunna.sha256
          tar -czf tunna-x86_64-linux.tar.gz dist/*

      - name: Extract notes
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" \
            '/^## /{section = index($2, v) == 1} section && $0 !~ /^## /{print}' \
            CHANGELOG.md > notes.md

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --title "tunna $GITHUB_REF_NAME" \
            --notes-file notes.md \
            tunna-x86_64-linux.tar.gz

  tray:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Linux deps for the tray build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Build
        working-directory: tray
        run: cargo build --release

      - name: Package
        working-directory: tray
        run: |
          strip target/release/tunna-tray
          mkdir dist
          cp target/release/tunna-tray dist/
          sha256sum dist/tunna-tray > dist/tunna-tray.sha256
          tar -czf tunna-tray-x86_64-linux.tar.gz dist/*

      - name: Upload
        working-directory: tray
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            --clobber \
            tunna-tray-x86_64-linux.tar.gz
