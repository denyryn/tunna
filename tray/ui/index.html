<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#141109">
  <meta name="description" content="tunna popup: expose local ports through your Cloudflare tunnel and manage the hostname routes.">
  <title>tunna</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M7 23V16a9 9 0 0 1 18 0v7' fill='none' stroke='%23e8dcbe' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='M4 27h24' stroke='%23a89a78' stroke-opacity='.5' stroke-width='1.6' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='15' r='2' fill='%23f2a83e'/%3E%3Cpath d='M10 23v-4M14 23v-6M18 23v-4.5' stroke='%235fd894' stroke-width='1.7'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <img class="mark" src="brand.svg" alt="" width="22" height="22">
        <h1 class="wordmark">tunna</h1>
        <span class="domain" id="base-domain">checking</span>
      </div>
      <div class="status" id="status" data-state="pending" role="status" title="Manager API reachability">
        <span class="dot" aria-hidden="true"></span>
        <span class="status-text" id="status-text">checking</span>
      </div>
    </header>

    <div class="toast" id="toast" role="alert" aria-live="assertive" hidden></div>

    <main class="main">
      <div class="list-head">
        <h2>Routes</h2>
        <span class="count" id="count"></span>
      </div>
      <ul class="scroll" id="list" aria-busy="true" aria-label="Tunnel routes"></ul>
    </main>

    <form class="composer" id="add-form" aria-label="Expose a port" autocomplete="off" novalidate>
      <input class="input port" id="port" name="port" inputmode="numeric" maxlength="5"
             placeholder="port" aria-label="Local port" required>
      <input class="input host" id="host" name="host"
             placeholder="auto: p3000.example.com" aria-label="Hostname, optional"
             spellcheck="false" autocapitalize="off">
      <button class="expose" id="expose" type="submit">Expose</button>
    </form>
  </div>
</body>
</html>
