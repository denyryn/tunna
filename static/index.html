<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#070b0e">
<meta name="description" content="tunna manager: expose local ports through your Cloudflare tunnel and manage the hostname routes.">
<title>tunna. routes</title>

<!-- Hallmark · 2026-11-07 · genre: modern-minimal (inferred, app screen)
     aligned to tunna-tray popup: same tokens, faces and components

<style>
/* Hallmark · 2026-11-07 · genre: modern-minimal (app screen)
 * theme: locked tokens, brass under a dome · scope: app
 * aligned to tunna-tray popup (same tokens, faces, components) · built: the project · redesign: align
 * waive 39b: the 19px "input" is the a11y checkbox overlay inside .switch; visible control is the track
 * waive 64: .port-chip mono is a tabular figure (port numbers); mono is the material
 */
:root {
  --bg: #070b0e;
  --surface: #0c1418;
  --surface-2: #111c21;
  --field: #0f181d;
  --field-line: #4d6a76;

  --line: rgba(158, 197, 185, .12);
  --line-strong: rgba(158, 197, 185, .22);
  --accent-line: rgba(233, 184, 114, .28);
  --btn-hover: rgba(158, 197, 185, .08);

  --text: #e4ede8;
  --host-ink: #dbe7e1;
  --muted: #8ea39c;
  --faint: #748a83;
  --placeholder: #667b74;

  --accent: #e9b872;
  --accent-soft: rgba(233, 184, 114, .13);
  --accent-ink: #231708;
  --glow-brass: rgba(233, 184, 114, .10);

  --live: #4ed6a1;
  --live-soft: rgba(78, 214, 161, .12);
  --live-line: rgba(78, 214, 161, .45);
  --live-track: rgba(78, 214, 161, .15);

  --danger: #f0736b;
  --danger-soft: rgba(240, 115, 107, .1);
  --danger-line: rgba(240, 115, 107, .34);
  --danger-ink: #ffd9d3;
  --danger-toast: rgba(32, 16, 15, .92);

  --glow-live: rgba(78, 214, 161, .06);
  --shade: rgba(0, 0, 0, .32);
  --sk: rgba(158, 197, 185, .09);

  --font-ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: ui-serif, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
  --font-mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, monospace;

  --motion: 120ms ease;
}
* { box-sizing: border-box; }
html, body { margin: 0; overflow-x: clip; }
body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 13px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(90% 45% at 50% -15%, var(--glow-brass), transparent 55%),
    radial-gradient(60% 40% at 110% 110%, var(--glow-live), transparent 65%);
}
main.shell {
  position: relative;
  max-width: 680px;
  margin: 0 auto;
  padding: 40px 20px 64px;
}
.top {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-bottom: 16px;
}
.mark { flex: none; width: 24px; height: 24px; }
.wordmark {
  margin: 0;
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 600;
  line-height: 1;
  color: var(--text);
  text-wrap: balance;
}
.wordmark::after { content: "."; color: var(--accent); }
.domain {
  overflow: hidden;
  min-width: 0;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--faint);
}
.sub {
  color: var(--muted);
  font-size: 12.5px;
  margin-bottom: 16px;
  max-width: 60ch;
}
.sub code { color: var(--host-ink); font-family: var(--font-mono); font-size: 12px; }
.toast {
  border: 1px solid var(--danger-line);
  border-left: 2px solid var(--danger);
  border-radius: 8px;
  background: var(--danger-toast);
  color: var(--danger-ink);
  font-size: 12px;
  padding: 8px 12px;
  margin-bottom: 12px;
}
.toast[hidden] { display: none; }
.panel {
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
}
form#add {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px;
  margin-bottom: 16px;
}
label.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}
label.field > span {
  font-size: 11px;
  color: var(--faint);
}
input {
  height: 34px;
  padding: 0 8px;
  border: 1px solid var(--field-line);
  border-radius: 7px;
  background: var(--field);
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 12px;
  transition: border-color var(--motion), box-shadow var(--motion);
}
input::placeholder { color: var(--placeholder); opacity: 1; }
input:hover { border-color: var(--muted); }
input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-soft);
}
#port { width: 96px; }
#host { flex: 1; min-width: 180px; }
button {
  height: 34px;
  padding: 0 12px;
  border: 1px solid var(--line-strong);
  border-radius: 7px;
  background: var(--surface-2);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 12.5px;
  cursor: pointer;
  transition: background-color var(--motion), border-color var(--motion), color var(--motion), filter var(--motion);
}
button:hover { border-color: var(--muted); background: var(--btn-hover); }
button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
  font-weight: 600;
}
button.primary:hover { filter: brightness(1.06); background: var(--accent); }
button.primary:active { transform: translateY(1px); }
button.ghost { background: transparent; }
button.danger { background: transparent; border-color: transparent; color: var(--faint); }
button.danger:hover { color: var(--danger); background: var(--danger-soft); border-color: var(--danger-line); }
button:disabled {
  background: var(--surface-2);
  border-color: var(--line);
  color: var(--muted);
  cursor: not-allowed;
  filter: none;
}
ul#list { display: flex; flex-direction: column; gap: 4px; padding: 8px; margin: 0; }
li.route {
  display: flex;
  align-items: center;
  gap: 8px;
  border-radius: 8px;
  padding: 4px 4px 4px 8px;
  transition: background-color var(--motion);
}
li.route:hover { background: var(--btn-hover); }
li.route.off .route-main { opacity: .5; }
.route-main { display: flex; flex: 1; align-items: center; gap: 8px; min-width: 0; }
.host-line { display: flex; align-items: center; gap: 8px; min-width: 0; }
.host-line .host {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: var(--font-mono);
  font-size: 12.5px;
  color: var(--host-ink);
}
.port-chip {
  flex: none;
  padding: 1px 4px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--surface-2);
  font-family: var(--font-mono);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
}
.target { color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
.switch { position: relative; display: inline-flex; width: 30px; height: 17px; flex: none; margin: 0 4px; }
.switch input {
  position: absolute;
  inset: 0;
  z-index: 2;
  opacity: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  cursor: pointer;
}
.switch .track {
  position: absolute; inset: 0;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  background: var(--sk);
  transition: background-color var(--motion), border-color var(--motion);
}
.switch .track::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: var(--muted);
  transition: transform var(--motion), background-color var(--motion);
}
.switch input:checked + .track {
  border-color: var(--live-line);
  background: var(--live-track);
}
.switch input:checked + .track::after {
  transform: translateX(13px);
  background: var(--live);
}
.switch input:focus-visible + .track {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.empty {
  padding: 40px 0;
  text-align: center;
  color: var(--muted);
}
.empty .dome { display: inline-block; width: 44px; height: 44px; color: var(--faint);opacity: .75;margin-bottom: 8px; }
.empty h2 {
  margin: 0 0 4px;
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 500;
  color: var(--text);
  text-wrap: balance;
}
.empty p { margin: 0; font-size: 12px; max-width: 30ch; margin-inline: auto; }
footer {
  margin-top: 24px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--faint);
  font-size: 11px;
}
footer img { width: 14px; height: 14px; opacity: .6; }
:where(button, input, [tabindex]):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
input:focus-visible { outline: none; }
::selection { background: var(--accent-soft); color: var(--accent-ink); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>
<body>
<main class="shell">
  <header class="top">
    <img class="mark" alt="" width="24" height="24" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M7 24V16a9 9 0 0 1 18 0v8' fill='none' stroke='%23e9b872' stroke-width='2.3' stroke-linecap='round'/%3E%3Cpath d='M4.5 27.5h23' stroke='%23e9b872' stroke-opacity='.45' stroke-width='1.5' stroke-linecap='round'/%3E%3Cpath d='M13 23v-4M16 23v-7M19 23v-2.6' stroke='%234ed6a1' stroke-width='1.6'/%3E%3C/svg%3E">
    <h1 class="wordmark">tunna</h1>
    <span class="domain" id="domain">checking</span>
  </header>
  <div class="toast err" id="err" role="alert"></div>
  <p class="sub">Public hostnames route to local ports. Wildcard ingress <code>*.<span id="wildcard">domain</span></code> is handled by this proxy.</p>

  <form id="add">
    <label class="field"><span>Port</span>
      <input id="port" type="number" min="1" max="65535" placeholder="3000" required>
    </label>
    <label class="field"><span>Hostname, optional</span>
      <input id="host" type="text" placeholder="auto: p3000" spellcheck="false" autocapitalize="off">
    </label>
    <button class="primary" type="submit">Expose</button>
  </form>

  <ul id="list"></ul>
  <div class="empty panel" id="empty" hidden>
    <svg class="dome" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M10 48V32a22 22 0 0 1 44 0v16"/><path d="M5 54h54" opacity=".5"/><path d="M22 48v-8M32 48V34M42 48v-5" opacity=".7"/><circle cx="32" cy="21" r="2.2" stroke="none" fill="currentColor"/></svg>
    <h2>No routes tunneled</h2>
    <p>Expose a local port above and it comes live here.</p>
  </div>

  <footer>
    <img alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M7 24V16a9 9 0 0 1 18 0v8' fill='none' stroke='%23748a83' stroke-width='2.3' stroke-linecap='round'/%3E%3C/svg%3E">
    <span>tunnel owned by cloudflared, routing by tunna</span>
  </footer>
</main>
<script>
const $ = (id) => document.getElementById(id);
let baseDomain = "";

async function api(path, opts = {}) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function showErr(msg) {
  const box = $("err");
  box.textContent = msg || "";
  box.hidden = !msg;
}

function switchEl(checked, onchange) {
  const label = document.createElement("label");
  label.className = "switch";
  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.checked = checked;
  cb.setAttribute("aria-label", "Route enabled");
  cb.disabled = false;
  cb.onchange = onchange;
  const track = document.createElement("span");
  track.className = "track";
  label.append(cb, track);
  return label;
}

function render(routes) {
  const list = $("list");
  list.innerHTML = "";
  $("empty").hidden = routes.length > 0;
  for (const r of routes) {
    const li = document.createElement("li");
    li.className = "route" + (r.enabled ? "" : " off");

    const toggle = switchEl(r.enabled, () => {
      mutate("PATCH", `/api/routes/${encodeURIComponent(r.host)}`, { enabled: cb.checked });
    });

    const info = document.createElement("div");
    info.className = "route-main";
    const hostLine = document.createElement("div");
    hostLine.className = "host-line";
    const host = document.createElement("div");
    host.className = "host";
    host.textContent = r.host;
    const chip = document.createElement("span");
    chip.className = "port-chip";
    chip.textContent = ":" + r.port;
    hostLine.append(host, chip);
    info.append(hostLine);

    const del = document.createElement("button");
    del.className = "danger ghost";
    del.textContent = "Remove";
    del.setAttribute("aria-label", "Delete route " + r.host);
    del.onclick = () => mutate("DELETE", `/api/routes/${encodeURIComponent(r.host)}`);

    li.append(toggle, info, del);
    list.append(li);
  }
}

async function refresh() {
  const data = await api("/api/routes");
  if (data.base_domain !== baseDomain) {
    baseDomain = data.base_domain;
    $("domain").textContent = baseDomain;
    $("wildcard").textContent = baseDomain;
    $("host").placeholder = "auto: p3000";
  }
  render(data.routes);
}

async function mutate(method, path, body) {
  try {
    showErr("");
    await api(path, { method, body: body ? JSON.stringify(body) : undefined });
    await refresh();
  } catch (e) { showErr(e.message); }
}

$("add").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    showErr("");
    await api("/api/routes", {
      method: "POST",
      body: JSON.stringify({ port: $("port").value, host: $("host").value }),
    });
    $("port").value = "";
    $("host").value = "";
    await refresh();
  } catch (err) { showErr(err.message); }
});

refresh().catch((e) => { showErr("Cannot reach manager: " + e.message); });
</script>
</body>
</html>
