<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tunnel Routes</title>
<style>
  :root { --bg:#10131a; --panel:#171b24; --line:#252b38; --text:#e6e9ef; --dim:#8b94a7; --accent:#5b9dff; --danger:#ff5d6c; --ok:#33d69f; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:820px; margin:0 auto; padding:32px 20px 64px; }
  h1 { font-size:20px; margin:0 0 4px; letter-spacing:-.01em; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:28px; }
  .sub code { color:var(--text); }
  form { display:flex; gap:10px; flex-wrap:wrap; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:28px; }
  form label { display:flex; flex-direction:column; gap:6px; font-size:12px; color:var(--dim); flex:1 1 200px; }
  input { background:#0c0f15; border:1px solid var(--line); border-radius:7px; color:var(--text); padding:9px 11px; font-size:14px; width:100%; }
  input:focus { outline:none; border-color:var(--accent); }
  button { cursor:pointer; border:1px solid var(--line); background:#222836; color:var(--text); border-radius:7px; padding:9px 16px; font-size:14px; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#06101f; font-weight:600; }
  button.ghost { background:transparent; }
  button.danger { color:var(--danger); }
  form button { align-self:flex-end; }
  ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  li { display:flex; align-items:center; gap:14px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  li.off { opacity:.5; }
  .host { font-weight:600; font-size:14px; }
  .target { color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums; }
  .grow { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .empty { color:var(--dim); text-align:center; padding:40px 0; border:1px dashed var(--line); border-radius:10px; }
  .err { color:var(--danger); font-size:13px; margin-bottom:14px; min-height:18px; }
  .switch { position:relative; width:36px; height:20px; flex:none; }
  .switch input { position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer; }
  .switch span { position:absolute; inset:0; background:#2a3140; border-radius:20px; transition:.15s; pointer-events:none; }
  .switch span::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; background:#8b94a7; border-radius:50%; transition:.15s; }
  .switch input:checked + span { background:rgba(51,214,159,.25); }
  .switch input:checked + span::after { transform:translateX(16px); background:var(--ok); }
</style>
</head>
<body>
<main>
  <h1>Tunnel routes</h1>
  <div class="sub">Public hostname → <code>localhost:PORT</code>. Wildcard ingress <code>*.<span id="domain">…</span></code> is handled by Caddy.</div>
  <div class="err" id="err"></div>

  <form id="add">
    <label>Port
      <input id="port" type="number" min="1" max="65535" placeholder="3000" required>
    </label>
    <label>Hostname (optional)
      <input id="host" type="text" placeholder="auto from port">
    </label>
    <button class="primary" type="submit">Expose port</button>
  </form>

  <ul id="list"></ul>
  <div class="empty" id="empty" hidden>No ports exposed yet.</div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let baseDomain = "";

async function api(path, opts = {}) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function showErr(msg) { $("err").textContent = msg || ""; }

function render(routes) {
  const list = $("list");
  list.innerHTML = "";
  $("empty").hidden = routes.length > 0;
  for (const r of routes) {
    const li = document.createElement("li");
    li.className = r.enabled ? "" : "off";

    const toggle = document.createElement("label");
    toggle.className = "switch";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = r.enabled;
    cb.onchange = () => mutate("PATCH", `/api/routes/${encodeURIComponent(r.host)}`, { enabled: cb.checked });
    toggle.append(cb, document.createElement("span"));

    const info = document.createElement("div");
    info.className = "grow";
    const host = document.createElement("div");
    host.className = "host";
    host.textContent = r.host;
    const target = document.createElement("div");
    target.className = "target";
    target.textContent = "→ localhost:" + r.port;
    info.append(host, target);

    const del = document.createElement("button");
    del.className = "danger ghost";
    del.textContent = "Remove";
    del.onclick = () => mutate("DELETE", `/api/routes/${encodeURIComponent(r.host)}`);

    li.append(toggle, info, del);
    list.append(li);
  }
}

async function refresh() {
  const data = await api("/api/routes");
  if (data.base_domain !== baseDomain) {
    baseDomain = data.base_domain;
    $("domain").textContent = baseDomain;
    $("host").placeholder = "auto: p3000." + baseDomain;
  }
  render(data.routes);
}

async function mutate(method, path, body) {
  try {
    showErr("");
    await api(path, { method, body: body ? JSON.stringify(body) : undefined });
    await refresh();
  } catch (e) { showErr(e.message); }
}

$("add").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    showErr("");
    await api("/api/routes", {
      method: "POST",
      body: JSON.stringify({ port: $("port").value, host: $("host").value }),
    });
    $("port").value = "";
    $("host").value = "";
    await refresh();
  } catch (err) { showErr(err.message); }
});

refresh().catch((e) => showErr("Cannot reach manager: " + e.message));
</script>
</body>
</html>
